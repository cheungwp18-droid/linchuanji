<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paper5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ead1"/>
      <stop offset="1" stop-color="#ecdcbb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#paper5)"/>
  <!-- 桌面陰影 -->
  <ellipse cx="400" cy="360" rx="250" ry="26" fill="#d9c69a" opacity=".6"/>
  <!-- 信封 -->
  <g transform="rotate(-6 400 300)">
    <rect x="220" y="220" width="360" height="220" rx="8" fill="#fbf4e2" stroke="#d9c69a" stroke-width="3"/>
    <path d="M220 226 L400 340 L580 226" fill="none" stroke="#d9c69a" stroke-width="4"/>
    <path d="M220 434 L350 320 M580 434 L450 320" fill="none" stroke="#e4d3ab" stroke-width="3"/>
    <!-- 火漆印 -->
    <circle cx="400" cy="330" r="34" fill="#b23a2e"/>
    <circle cx="400" cy="330" r="34" fill="none" stroke="#8f2a22" stroke-width="3"/>
    <text x="400" y="342" text-anchor="middle" font-family="Kaiti SC, STKaiti, KaiTi, serif" font-size="30" fill="#f3ead9">信</text>
  </g>
  <!-- 露出的小紙條 -->
  <g transform="rotate(8 560 180)">
    <rect x="480" y="120" width="170" height="120" rx="6" fill="#fffaf0" stroke="#e0cfa2" stroke-width="3"/>
    <g stroke="#a9854f" stroke-width="5" stroke-linecap="round" opacity=".8">
      <line x1="500" y1="150" x2="630" y2="150"/>
      <line x1="500" y1="176" x2="620" y2="176"/>
      <line x1="500" y1="202" x2="590" y2="202"/>
    </g>
    <text x="560" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#9e2b25">@</text>
  </g>
  <!-- 筆 -->
  <g transform="rotate(24 180 380)">
    <rect x="120" y="372" width="150" height="12" rx="6" fill="#2f4a47"/>
    <path d="M270 372 l28 6 l-28 6 Z" fill="#a9854f"/>
  </g>
</svg>
