<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a44"/>
      <stop offset="1" stop-color="#131c21"/>
    </linearGradient>
    <filter id="b16a"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="b7a"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#sky1)"/>
  <!-- 城市燈火散景 -->
  <g filter="url(#b16a)" opacity=".55">
    <circle cx="120" cy="140" r="36" fill="#e8b04b"/>
    <circle cx="255" cy="88" r="22" fill="#b23a2e"/>
    <circle cx="430" cy="150" r="42" fill="#e8b04b"/>
    <circle cx="610" cy="98" r="26" fill="#d98a3d"/>
    <circle cx="716" cy="180" r="30" fill="#b23a2e"/>
    <circle cx="345" cy="205" r="18" fill="#f0d9a8"/>
  </g>
  <!-- 雨痕 -->
  <g stroke="#cfe0e6" stroke-width="1.5" opacity=".26" stroke-linecap="round">
    <line x1="120" y1="0" x2="88" y2="150"/>
    <line x1="220" y1="0" x2="196" y2="170"/>
    <line x1="330" y1="0" x2="300" y2="140"/>
    <line x1="470" y1="0" x2="440" y2="160"/>
    <line x1="640" y1="0" x2="610" y2="150"/>
    <line x1="740" y1="0" x2="712" y2="140"/>
    <line x1="160" y1="180" x2="132" y2="320"/>
    <line x1="380" y1="190" x2="352" y2="330"/>
    <line x1="700" y1="200" x2="672" y2="330"/>
  </g>
  <!-- 玻璃窗上淡淡的倒影 -->
  <g filter="url(#b7a)" opacity=".2">
    <ellipse cx="560" cy="300" rx="54" ry="68" fill="#f3ead9"/>
    <ellipse cx="540" cy="292" rx="6" ry="9" fill="#1a262c"/>
    <ellipse cx="582" cy="292" rx="6" ry="9" fill="#1a262c"/>
    <path d="M542 342 q18 14 38 0" stroke="#1a262c" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 窗下緣 / 座椅 -->
  <rect y="432" width="800" height="68" fill="#0e1519"/>
  <!-- 窗框 -->
  <rect x="6" y="6" width="788" height="488" fill="none" stroke="#0b1215" stroke-width="14"/>
</svg>
